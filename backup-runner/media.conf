# The R2 buckets the media copy copies, one name per line.
#
# Each night the runner copies new files from each bucket here into
# media/<bucket>/ in indy-center-backups. It never deletes or replaces a file there, so
# a database backup from any date still finds its uploads. The buckets must be on the
# same Cloudflare account, and the runner's R2 key must be able to read them.

# The CMS's public and private uploads (Indy-Center/payload).
payload-media
payload-private
