# How often each app is backed up, and how long its frequent copies are kept.
#
#   app      every   keep
#
# app:   the app's folder name in ~/apps (its repository's name).
# every: hours between backups: 1, 2, 3, 4, 6, 8, 12 or 24. Backups run at 07:00 UTC and
#        every that many hours after it.
# keep:  days to keep the copies in frequent/. 0 means no frequent tier, which only
#        works with every = 24.
#
# An app not listed here is backed up nightly, with no frequent tier. Every app also
# keeps one copy a day for 60 days (daily/) and one a month for 12 months (monthly/).
#
# R2's lifecycle rule on frequent/ deletes at one age for every app: keep it at the
# largest "keep" below. A change here deploys on merge, like the rest of this repository.

payload  6  14
