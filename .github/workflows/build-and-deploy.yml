name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: ci # skipped if any check fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          VANDERBILT_HOST: ${{ vars.VANDERBILT_HOST }}
          VANDERBILT_DEPLOY_USER: ${{ vars.VANDERBILT_DEPLOY_USER }}
          VANDERBILT_DEPLOY_SSH_KEY: ${{ secrets.VANDERBILT_DEPLOY_SSH_KEY }}
          VANDERBILT_KNOWN_HOSTS: ${{ secrets.VANDERBILT_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VANDERBILT_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VANDERBILT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VANDERBILT_HOST
            User $VANDERBILT_DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      # --delete removes files dropped from traefik/; excluded files (.env) are never deleted.
      - name: Sync traefik/ to ~/traefik/
        run: rsync -rlz --delete --exclude=.env traefik/ vps:traefik/

      - name: docker compose up -d
        run: |
          ssh vps '
            set -e
            cd ~/traefik
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            sleep 15
            state="$(docker inspect -f "{{.State.Running}} {{.RestartCount}}" traefik)"
            echo "traefik running/restarts: $state"
            if [ "$state" != "true 0" ]; then
              docker compose logs --tail 50 traefik
              exit 1
            fi
          '

      # Writes the backup runner's rclone config, with its one remote `r2` pointing at
      # Cloudflare R2. The file goes over stdin so the keys never appear in a command line,
      # and only deploy can read it. no_check_bucket: the key can't create buckets.
      - name: Write the backup runner's rclone config
        env:
          ACCESS_KEY_ID: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in ACCESS_KEY_ID SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; see the README's secrets table"
              exit 1
            fi
          done
          cat <<EOF | ssh vps '
            set -e
            umask 077
            mkdir -p ~/backup-runner/secrets
            chmod 700 ~/backup-runner/secrets
            cat > ~/backup-runner/secrets/rclone.conf.tmp
            mv ~/backup-runner/secrets/rclone.conf.tmp ~/backup-runner/secrets/rclone.conf
          '
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $ACCESS_KEY_ID
          secret_access_key = $SECRET_ACCESS_KEY
          endpoint = https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      # Writes the runner's other secrets beside rclone.conf: the age key that encrypts
      # (and, for restores, decrypts) every backup, and the two Discord webhook URLs.
      # Each value goes over stdin, never on a command line, and only deploy can read it.
      - name: Write the backup runner's age key and Discord webhooks
        env:
          AGE_KEY: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_AGE_KEY }}
          REPORT_WEBHOOK: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_REPORT_WEBHOOK }}
          ALERT_WEBHOOK: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_ALERT_WEBHOOK }}
        run: |
          for name in AGE_KEY REPORT_WEBHOOK ALERT_WEBHOOK; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; see the README's secrets table"
              exit 1
            fi
          done
          # write_secret FILE: stdin becomes ~/backup-runner/secrets/FILE, mode 600.
          write_secret() {
            ssh vps "
              set -e
              umask 077
              mkdir -p ~/backup-runner/secrets
              chmod 700 ~/backup-runner/secrets
              cat > ~/backup-runner/secrets/$1.tmp
              mv ~/backup-runner/secrets/$1.tmp ~/backup-runner/secrets/$1
            "
          }
          printf '%s\n' "$AGE_KEY" | write_secret age.key
          printf '%s\n' "$REPORT_WEBHOOK" | write_secret report-webhook.url
          printf '%s\n' "$ALERT_WEBHOOK" | write_secret alert-webhook.url

      # The backup runner: its scripts and schedule file into ~/backup-runner/. --delete
      # removes files dropped from backup-runner/, but never the folders that live only on
      # the box: secrets/, the runner's state/ and logs/, and bin/ (age and rclone).
      # These come after the secrets, so cron never starts a runner that lacks them.
      - name: Sync backup-runner/ to ~/backup-runner/
        run: |
          rsync -rlz --delete \
            --exclude=/secrets/ --exclude=/state/ --exclude=/logs/ --exclude=/bin/ \
            backup-runner/ vps:backup-runner/

      # Installs the pinned age and rclone into ~/backup-runner/bin (skipped when already
      # there), then the hourly crontab entry that starts the runner.
      - name: Install the backup runner's tools and crontab entry
        run: |
          ssh vps '
            set -e
            bash ~/backup-runner/install-tools.sh ~/backup-runner/bin
            bash ~/backup-runner/install-cron.sh
          '
