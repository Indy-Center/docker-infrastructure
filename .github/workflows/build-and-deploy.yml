name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Runs once per server, each on its own: one failing never cancels or blocks another.
  build-and-deploy:
    name: Deploy to ${{ matrix.server }}
    needs: ci # skipped if any check fails
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every server this repository deploys to, by the prefix of its four org settings
        # (VANDERBILT_HOST and so on; see the README). Add or drop a server here. The
        # runner's server name, in its report and alerts, is the prefix in lower case.
        server: [VANDERBILT, ALEXANDRIA]
    concurrency:
      group: deploy-${{ matrix.server }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # A server missing any of its four settings fails here, before anything reaches it.
      - name: Set up SSH
        env:
          SERVER: ${{ matrix.server }}
          HOST: ${{ vars[format('{0}_HOST', matrix.server)] }}
          DEPLOY_USER: ${{ vars[format('{0}_DEPLOY_USER', matrix.server)] }}
          DEPLOY_SSH_KEY: ${{ secrets[format('{0}_DEPLOY_SSH_KEY', matrix.server)] }}
          KNOWN_HOSTS: ${{ secrets[format('{0}_KNOWN_HOSTS', matrix.server)] }}
        run: |
          missing=""
          for name in HOST DEPLOY_USER DEPLOY_SSH_KEY KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing+=" ${SERVER}_$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set for $SERVER:$missing. See the README's settings table; nothing was deployed to $SERVER"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      # Writes ~/traefik/.env, which gives Traefik its Cloudflare token (the CF_DNS_API_TOKEN
      # repo secret, shared by every server). The deploy owns that file and rewrites it every
      # run, so the token changes by updating the secret and re-running the deploy, never by
      # editing the file on the box. The value goes over stdin, never on a command line, and
      # only deploy can read it. It comes before the sync, so a missing secret stops the
      # deploy before anything reaches the server.
      - name: Write Traefik's Cloudflare token
        env:
          SERVER: ${{ matrix.server }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
        run: |
          if [ -z "$CF_DNS_API_TOKEN" ]; then
            echo "::error::Not set: CF_DNS_API_TOKEN. See the README's settings table; nothing was deployed to $SERVER"
            exit 1
          fi
          printf 'CF_DNS_API_TOKEN=%s\n' "$CF_DNS_API_TOKEN" | ssh vps '
            set -e
            mkdir -p ~/traefik
            umask 077
            cat > ~/traefik/.env.tmp
            mv ~/traefik/.env.tmp ~/traefik/.env
          '

      # --delete removes files dropped from traefik/; excluded files (.env) are never deleted.
      - name: Sync traefik/ to ~/traefik/
        run: rsync -rlz --delete --exclude=.env traefik/ vps:traefik/

      - name: docker compose up -d
        run: |
          ssh vps '
            set -e
            cd ~/traefik
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            sleep 15
            state="$(docker inspect -f "{{.State.Running}} {{.RestartCount}}" traefik)"
            echo "traefik running/restarts: $state"
            if [ "$state" != "true 0" ]; then
              docker compose logs --tail 50 traefik
              exit 1
            fi
          '

      # Writes the backup runner's rclone config, with its one remote `r2` pointing at
      # Cloudflare R2. The file goes over stdin so the keys never appear in a command line,
      # and only deploy can read it. no_check_bucket: the key can't create buckets.
      - name: Write the backup runner's rclone config
        env:
          ACCESS_KEY_ID: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in ACCESS_KEY_ID SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; see the README's secrets table"
              exit 1
            fi
          done
          cat <<EOF | ssh vps '
            set -e
            umask 077
            mkdir -p ~/backup-runner/secrets
            chmod 700 ~/backup-runner/secrets
            cat > ~/backup-runner/secrets/rclone.conf.tmp
            mv ~/backup-runner/secrets/rclone.conf.tmp ~/backup-runner/secrets/rclone.conf
          '
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $ACCESS_KEY_ID
          secret_access_key = $SECRET_ACCESS_KEY
          endpoint = https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      # Writes the runner's other secrets beside rclone.conf: the age key that encrypts
      # (and, for restores, decrypts) every backup, and the two Discord webhook URLs.
      # Each value goes over stdin, never on a command line, and only deploy can read it.
      - name: Write the backup runner's age key and Discord webhooks
        env:
          AGE_KEY: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_AGE_KEY }}
          REPORT_WEBHOOK: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_REPORT_WEBHOOK }}
          ALERT_WEBHOOK: ${{ secrets.INDY_CENTER_BACKUP_RUNNER_ALERT_WEBHOOK }}
        run: |
          for name in AGE_KEY REPORT_WEBHOOK ALERT_WEBHOOK; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; see the README's secrets table"
              exit 1
            fi
          done
          # write_secret FILE: stdin becomes ~/backup-runner/secrets/FILE, mode 600.
          write_secret() {
            ssh vps "
              set -e
              umask 077
              mkdir -p ~/backup-runner/secrets
              chmod 700 ~/backup-runner/secrets
              cat > ~/backup-runner/secrets/$1.tmp
              mv ~/backup-runner/secrets/$1.tmp ~/backup-runner/secrets/$1
            "
          }
          printf '%s\n' "$AGE_KEY" | write_secret age.key
          printf '%s\n' "$REPORT_WEBHOOK" | write_secret report-webhook.url
          printf '%s\n' "$ALERT_WEBHOOK" | write_secret alert-webhook.url

      # ~/backup-runner/server: the name the runner's report, alerts and status ping give
      # this server, the matrix prefix in lower case (vanderbilt).
      - name: Write the backup runner's server name
        env:
          SERVER: ${{ matrix.server }}
        run: |
          printf '%s\n' "${SERVER,,}" | ssh vps '
            set -e
            mkdir -p ~/backup-runner
            cat > ~/backup-runner/server.tmp
            mv ~/backup-runner/server.tmp ~/backup-runner/server
          '

      # The backup runner: its scripts and schedule file into ~/backup-runner/. --delete
      # removes files dropped from backup-runner/, but never what lives only on the box:
      # secrets/, the runner's state/ and logs/, bin/ (age and rclone), and server.
      # These come after the secrets, so cron never starts a runner that lacks them.
      - name: Sync backup-runner/ to ~/backup-runner/
        run: |
          rsync -rlz --delete \
            --exclude=/secrets/ --exclude=/state/ --exclude=/logs/ --exclude=/bin/ \
            --exclude=/server \
            backup-runner/ vps:backup-runner/

      # The server's base setup, so an admin can run `sudo bash ~deploy/host/apply.sh --check`
      # against the merged version. The deploy only copies it: it never runs it, since
      # changing the base system is an admin's job (see host/README.md).
      - name: Sync host/ to ~/host/ (never run)
        run: rsync -rlz --delete host/ vps:host/

      # Installs the pinned age and rclone into ~/backup-runner/bin (skipped when already
      # there), the hourly crontab entry that starts the runner, and the `backups`
      # command for the helper commands.
      - name: Install the backup runner's tools, crontab entry and backups command
        run: |
          ssh vps '
            set -e
            bash ~/backup-runner/install-tools.sh ~/backup-runner/bin
            bash ~/backup-runner/install-cron.sh
            bash ~/backup-runner/install-command.sh
          '
