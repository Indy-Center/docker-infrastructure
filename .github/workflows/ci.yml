name: CI

# No push trigger: on main, CI runs inside build-and-deploy.yml, so it still runs once per commit.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deploy's and staging check's own steps, against a fake server.
      - name: The deploy writes Traefik's Cloudflare token from its secret
        run: bash tests/traefik/token-test.sh

      - name: Recreate the VPS-side pieces
        run: |
          docker network create traefik-shared
          docker network create frontend
          echo "CF_DNS_API_TOKEN=ci-dummy-token" > traefik/.env
          # CI has no real Cloudflare token, so the wildcard request always fails here.
          # Point it at Let's Encrypt staging so those failures never count against production.
          sed -i 's|^\( *\)storage: /letsencrypt/acme.json$|&\n\1caServer: https://acme-staging-v02.api.letsencrypt.org/directory|' traefik/traefik.yml
          grep -q 'caServer: https://acme-staging' traefik/traefik.yml

      - name: Start Traefik and the example app
        run: |
          docker compose -f traefik/docker-compose.yml up -d
          docker compose -f examples/app/deploy/docker-compose.yml up -d
          sleep 15

      - name: Traefik stays up
        run: |
          state="$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' traefik)"
          echo "traefik running/restarts: $state"
          [ "$state" = "true 0" ]

      - name: Routing works
        run: |
          # File provider loaded dynamic/: the dashboard router comes from there.
          curl -fsS http://127.0.0.1:8080/api/http/routers | grep -q '"dashboard@file"'
          # web redirects to websecure.
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example-app.flyindycenter.com' http://127.0.0.1/)"
          echo "http status: $code"
          [ "$code" = 301 ] || [ "$code" = 308 ]
          # Docker provider routes a labelled app on traefik-shared.
          curl -fsSk --resolve example-app.flyindycenter.com:443:127.0.0.1 https://example-app.flyindycenter.com/ | grep -q '^Hostname:'

      - name: Traefik logs
        if: always()
        run: docker logs traefik

  # The backup runner, run against fake apps, a local folder standing in for R2 and a fake
  # Discord and status page. See tests/backup-runner/test.sh.
  backup-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install age and rclone (the versions the VPS gets)
        run: |
          bash backup-runner/install-tools.sh "$HOME/backup-runner-bin"
          echo "$HOME/backup-runner-bin" >> "$GITHUB_PATH"

      # The weekly restore check's tests load a real dump into Postgres 17, with the
      # runner's Docker.
      - name: Runner tests
        run: bash tests/backup-runner/test.sh

      # The helper commands (backups.sh), on the same fake VPS. The scratch CMS and restore
      # check tests use the runner's Docker and a real Postgres 17: the restore check is
      # checked to pass on a known-good dump, and to fail on a corrupt one and on one
      # missing a table.
      - name: Helper command tests
        run: bash tests/backup-runner/helpers-test.sh

      # In throwaway home folders: `backups` works by name in a new login or interactive shell.
      - name: The backups command installs and runs
        run: bash tests/backup-runner/install-command-test.sh

      - name: Crontab entry installs once, however often the deploy runs
        run: |
          bash backup-runner/install-cron.sh
          bash backup-runner/install-cron.sh
          crontab -l
          [ "$(crontab -l | grep -c '# backup-runner$')" = 1 ]

  # The server's base setup (host/). Nothing here touches the runner's own system: apply.sh
  # runs against a fake root, and bootstrap.sh in a container. See tests/host/.
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The real sshd, so `sshd -t` really checks the config apply.sh writes.
      - name: Install sshd
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          sudo mkdir -p /run/sshd

      - name: apply.sh against a fake root
        run: bash tests/host/test.sh

      - name: bootstrap.sh in an ubuntu:26.04 container
        run: bash tests/host/bootstrap-test.sh

      - name: The deploy ships host/ and never runs it
        run: bash tests/host/deploy-test.sh
