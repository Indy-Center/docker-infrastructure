# Managed by docker-infrastructure's host/ (apply.sh). Change it there, not here.
# Named 00- so it comes first: sshd keeps the first value it reads for most settings, and
# the image's own drop-ins (such as cloud-init's 50-) come later.

# Keys only. Root never logs in over SSH: each admin has their own account.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# Nothing here runs graphical programs.
X11Forwarding no

# Who may log in: every admin, plus deploy, which GitHub Actions deploys as. To add or
# remove an admin, change this line (host/README.md). apply.sh refuses a version without
# deploy, since every deploy would then fail.
AllowUsers hayden deploy
