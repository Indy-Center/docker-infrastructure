# Deployed to /home/deploy/traefik/ on the VPS. /home/deploy/traefik/.env (not in git) holds CF_DNS_API_TOKEN.
name: traefik

services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Dashboard, loopback only: ssh -L 8080:localhost:8080 <user>@<vps>
      - "127.0.0.1:8080:8080"
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?CF_DNS_API_TOKEN must be set in /home/deploy/traefik/.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      # Named volume, not a file in /home/deploy/traefik/, so deploys can never overwrite or delete issued certs.
      - acme:/letsencrypt
    networks:
      - traefik-shared
      # Temporary: reaches apps still on the old Traefik's network until DEV-170 moves them.
      - frontend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  acme:

networks:
  traefik-shared:
    external: true
  frontend:
    external: true
